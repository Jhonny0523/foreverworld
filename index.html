<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Forever World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Pixelify+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
  <script>document.write('<link rel="stylesheet" href="styles.css?v=' + Date.now() + '" />');</script>
</head>
<body>

  <div id="update-banner" class="update-banner" style="display:none;"></div>

  <header class="hud-header">
    <div class="container-app hud-container">
      <div class="hud-top-row">
        <div class="hud-brand">
          <div id="hud-crest" class="mc-slot hud-crest-slot"></div>
          <div>
            <h1 id="hud-title" class="font-pixel text-white" style="margin: 0; font-size: 1rem; line-height: 1.2;">FOREVER WORLD</h1>
            <p id="hud-sub" class="text-xs text-muted" style="margin: 3px 0 0 0;"></p>
          </div>
        </div>

        <div class="hud-controls">
          <div class="hud-era-box">
            <div class="flex-between text-xs font-mono" style="margin-bottom: 5px; gap: 6px;">
              <span id="hud-era" class="font-pixel">ERA 0</span>
              <span id="hud-xp-text" class="text-muted" style="font-size: 11px;"></span>
            </div>
            <div class="xp-bar-track">
              <div id="hud-xp-bar" class="xp-bar-fill" style="width: 0%;"></div>
              <div class="xp-bar-notches"></div>
            </div>
          </div>

          <button id="hud-fx-pill" class="mc-slot hud-pill" title="Ir a Economía">
            <div id="hud-fx-rate" class="font-mono text-white" style="font-size: 11px; font-weight: 700;"></div>
            <div id="hud-fx-status" class="font-mono text-muted" style="font-size: 10px;"></div>
          </button>

          <button id="hud-cloud-pill" class="mc-slot hud-pill" data-action="open-backup" title="Estado de Supabase y puntos de restauración">
            <div id="hud-cloud-label" class="font-mono text-white" style="font-size: 11px; font-weight: 700;">Supabase</div>
            <div id="hud-cloud-sub" class="font-mono text-muted" style="font-size: 10px;">Conectando...</div>
          </button>

          <label class="hud-me-label text-xs text-muted font-mono">
            <span>Soy:</span>
            <select id="me-select" class="mc-select font-mono" style="width: auto; padding: 5px 8px;"></select>
          </label>

          <div class="hud-actions">
            <button class="mc-btn mc-btn-diamond" data-action="open-report" title="Resumen para Discord">Resumen</button>
            <button class="mc-btn mc-btn-redstone" data-action="open-reset" title="Borrar todo">Reiniciar</button>
          </div>
        </div>
      </div>

      <nav class="hotbar-wrap no-scrollbar" aria-label="Menú principal">
        <button class="hotbar-tab" data-tab="roadmap"><span class="hotbar-key">1</span><span class="tab-icon" data-icon="compass"></span><span>Roadmap</span></button>
        <button class="hotbar-tab" data-tab="economy"><span class="hotbar-key">2</span><span class="tab-icon" data-icon="emerald"></span><span>Economía</span></button>
        <button class="hotbar-tab" data-tab="state"><span class="hotbar-key">3</span><span class="tab-icon" data-icon="gavel"></span><span>Estados y Leyes</span><span id="badge-state-rev" class="mc-tag tag-redstone" style="display:none;padding:1px 6px;font-size:10px;margin-left:4px;"></span></button>
        <button class="hotbar-tab" data-tab="lore"><span class="hotbar-key">4</span><span class="tab-icon" data-icon="scroll"></span><span>Lore y Crónicas</span></button>
        <button class="hotbar-tab" data-tab="territory"><span class="hotbar-key">5</span><span class="tab-icon" data-icon="rail"></span><span>Territorio</span></button>
        <button class="hotbar-tab" data-tab="manual"><span class="hotbar-key">6</span><span class="tab-icon" data-icon="enchanted_book"></span><span>Manual</span></button>
      </nav>
    </div>
  </header>

  <main class="container-app" style="padding-top: 22px; padding-bottom: 80px;">
    <section id="view-roadmap" class="tab-view section-stack"></section>
    <section id="view-economy" class="tab-view section-stack"></section>
    <section id="view-state" class="tab-view section-stack"></section>
    <section id="view-lore" class="tab-view section-stack"></section>
    <section id="view-territory" class="tab-view section-stack"></section>
    <section id="view-manual" class="tab-view section-stack"></section>
  </main>

  <!-- Modal: reiniciar -->
  <div id="modal-reset" class="mc-modal-backdrop">
    <div class="mc-panel mc-modal p-lg">
      <h3 class="font-pixel text-redstone text-base" style="margin: 0 0 8px 0;">¿BORRAR TODO EL MUNDO?</h3>
      <p class="text-xs text-muted" style="margin: 0 0 10px 0;">Se reinician hitos, economía, leyes, lore y censo en Supabase para TODOS. Antes se guarda un punto de restauración en Supabase.</p>
      <label class="text-xs font-mono text-white" style="display:block;margin-bottom:6px;">Para evitar clics por error, escribe <strong>BORRAR</strong>:</label>
      <input id="reset-confirm-input" class="mc-input font-mono" style="margin-bottom:14px;" placeholder="Escribe BORRAR" autocomplete="off" />
      <div class="flex-row-wrap" style="justify-content: flex-end; gap: 8px;">
        <button class="mc-btn" data-action="close-modal">Cancelar</button>
        <button class="mc-btn mc-btn-redstone" data-action="confirm-reset">Sí, borrar todo</button>
      </div>
    </div>
  </div>

  <!-- Modal: Supabase / puntos de restauración -->
  <div id="modal-backup" class="mc-modal-backdrop">
    <div class="mc-panel mc-modal p-lg">
      <div class="flex-between" style="margin-bottom: 10px;">
        <h3 class="font-pixel text-emerald text-base" style="margin: 0;">SUPABASE · NUBE DEL MUNDO</h3>
        <button class="mc-btn" data-action="close-modal" style="padding: 3px 8px;">✕</button>
      </div>
      <div id="cloud-backup-panel" class="mc-panel-dark p-sm"></div>
    </div>
  </div>

  <!-- Modal: editar acto administrativo / ley -->
  <div id="modal-law-edit" class="mc-modal-backdrop">
    <div class="mc-panel mc-modal p-lg" style="max-width: 700px;">
      <div class="flex-between" style="margin-bottom: 10px;">
        <h3 class="font-pixel text-emerald text-base" style="margin: 0;">✎ EDITAR ACTO ADMINISTRATIVO / LEY</h3>
        <button class="mc-btn" data-action="close-modal" style="padding: 3px 8px;">✕</button>
      </div>
      <div class="section-stack" style="gap: 10px;">
        <div>
          <label class="text-xs font-mono text-white" style="display:block;margin-bottom:4px;">Título del Acto:</label>
          <input id="edit-law-title" class="mc-input" placeholder="Ej. Ley de Penas y Régimen Sancionatorio Bilateral" />
        </div>
        <div class="grid-3" style="gap: 8px;">
          <div>
            <label class="text-xs font-mono text-white" style="display:block;margin-bottom:4px;">Tipo de Acto:</label>
            <select id="edit-law-doctype" class="mc-select font-mono"></select>
          </div>
          <div>
            <label class="text-xs font-mono text-white" style="display:block;margin-bottom:4px;">N° Consecutivo:</label>
            <input id="edit-law-num" type="number" min="1" class="mc-input font-mono" />
          </div>
          <div>
            <label class="text-xs font-mono text-white" style="display:block;margin-bottom:4px;">Serie TRD:</label>
            <select id="edit-law-trd" class="mc-select font-mono"></select>
          </div>
        </div>
        <div>
          <div class="flex-between" style="margin-bottom: 4px;">
            <label class="text-xs font-mono text-white">Cuerpo Normativo (Epígrafe, Considerandos, Artículos y Parágrafos):</label>
            <button type="button" class="mc-btn" style="padding: 2px 7px; font-size: 11px;" data-action="law-template" data-target="edit-law-text">📋 Plantilla Acto de Miscolandia</button>
          </div>
          <textarea id="edit-law-text" rows="10" class="mc-textarea" style="font-size: 13px; line-height: 1.5;"></textarea>
        </div>
        <div>
          <label class="text-xs font-mono text-white" style="display:block;margin-bottom:4px;">Pena / Sanción / Disposición Ejecutiva (opcional):</label>
          <input id="edit-law-sanction" class="mc-input" placeholder="Ej. Multa entre 5 y 40 OE según gravedad..." />
        </div>
      </div>
      <div class="flex-row-wrap" style="justify-content: flex-end; gap: 8px; margin-top: 14px;">
        <button class="mc-btn" data-action="close-modal">Cancelar</button>
        <button class="mc-btn mc-btn-emerald" data-action="law-edit-save">✔ Guardar cambios</button>
      </div>
    </div>
  </div>

  <!-- Modal: resumen -->
  <div id="modal-report" class="mc-modal-backdrop">
    <div class="mc-panel mc-modal p-lg">
      <div class="flex-between" style="margin-bottom: 10px;">
        <h3 id="report-modal-title" class="font-pixel text-diamond text-base" style="margin: 0;">RESUMEN PARA DISCORD</h3>
        <button class="mc-btn" data-action="close-modal" style="padding: 3px 8px;">✕</button>
      </div>
      <textarea id="report-area" rows="12" class="mc-textarea font-mono" readonly style="font-size: 11px; margin-bottom: 12px;"></textarea>
      <div class="flex-row-wrap" style="justify-content: flex-end;">
        <button class="mc-btn mc-btn-diamond" data-action="copy-report">📋 Copiar</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function () {
      var v = Date.now();
      ['supabase-config.js', 'cloud.js', 'icons.js', 'eras.js', 'data.js', 'engine.js', 'app.js'].forEach(function (f) {
        document.write('<script src="' + f + '?v=' + v + '"><\/script>');
      });
    })();
  </script>
</body>
</html>
