<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forever World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20261117193000" />
</head>
<body>

  <header class="hud-header">
    <div class="container-app" style="padding-top: 12px; padding-bottom: 10px;">
      <div class="flex-between">
        <div class="flex-row-wrap" style="gap: 12px;">
          <div id="hud-crest" class="mc-slot" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"></div>
          <div>
            <h1 id="hud-title" class="font-pixel text-white" style="margin: 0; font-size: 1rem; line-height: 1.2;">FOREVER WORLD</h1>
            <p id="hud-sub" class="text-xs text-muted" style="margin: 3px 0 0 0;"></p>
          </div>
        </div>

        <div class="flex-row-wrap" style="gap: 12px;">
          <div style="min-width: 200px;">
            <div class="flex-between text-xs font-mono" style="margin-bottom: 4px; gap: 6px;">
              <span id="hud-era" class="font-pixel" >ERA 0</span>
              <span id="hud-xp-text" class="text-muted" style="font-size: 11px;"></span>
            </div>
            <div class="xp-bar-track">
              <div id="hud-xp-bar" class="xp-bar-fill" style="width: 0%;"></div>
              <div class="xp-bar-notches"></div>
            </div>
          </div>

          <button id="hud-fx-pill" class="mc-slot" title="Ir a Economía" style="padding: 6px 10px; cursor: pointer; text-align: left; ">
            <div id="hud-fx-rate" class="font-mono text-white" style="font-size: 11px; font-weight: 700;"></div>
            <div id="hud-fx-status" class="font-mono text-muted" style="font-size: 10px;"></div>
          </button>

          <button id="hud-cloud-pill" class="mc-slot" data-action="open-backup" title="Estado de Supabase y puntos de restauración" style="padding: 6px 10px; cursor: pointer; text-align: left;">
            <div id="hud-cloud-label" class="font-mono text-white" style="font-size: 11px; font-weight: 700;">Supabase</div>
            <div id="hud-cloud-sub" class="font-mono text-muted" style="font-size: 10px;">Conectando...</div>
          </button>

          <label class="text-xs text-muted font-mono" style="display: flex; align-items: center; gap: 6px;">
            Soy:
            <select id="me-select" class="mc-select font-mono" style="width: auto; padding: 4px 6px;"></select>
          </label>

          <div class="flex-row-wrap" style="gap: 6px;">
            <button class="mc-btn mc-btn-diamond" data-action="open-report" title="Resumen para Discord">Resumen</button>
            <button class="mc-btn mc-btn-redstone" data-action="open-reset" title="Borrar todo">Reiniciar</button>
          </div>
        </div>
      </div>

      <nav class="hotbar-wrap no-scrollbar" style="margin-top: 12px;" aria-label="Menú principal">
        <button class="hotbar-tab" data-tab="roadmap"><span class="hotbar-key">1</span><span class="tab-icon" data-icon="compass"></span><span>Roadmap</span></button>
        <button class="hotbar-tab" data-tab="economy"><span class="hotbar-key">2</span><span class="tab-icon" data-icon="emerald"></span><span>Economía</span></button>
        <button class="hotbar-tab" data-tab="state"><span class="hotbar-key">3</span><span class="tab-icon" data-icon="gavel"></span><span>Estados y Leyes</span></button>
        <button class="hotbar-tab" data-tab="lore"><span class="hotbar-key">4</span><span class="tab-icon" data-icon="scroll"></span><span>Lore y Crónicas</span></button>
        <button class="hotbar-tab" data-tab="territory"><span class="hotbar-key">5</span><span class="tab-icon" data-icon="rail"></span><span>Territorio</span></button>
        <button class="hotbar-tab" data-tab="manual"><span class="hotbar-key">6</span><span class="tab-icon" data-icon="enchanted_book"></span><span>Manual</span></button>
      </nav>
    </div>
  </header>

  <main class="container-app" style="padding-top: 22px; padding-bottom: 80px;">
    <section id="view-roadmap" class="tab-view section-stack"></section>
    <section id="view-economy" class="tab-view section-stack"></section>
    <section id="view-state" class="tab-view section-stack"></section>
    <section id="view-lore" class="tab-view section-stack"></section>
    <section id="view-territory" class="tab-view section-stack"></section>
    <section id="view-manual" class="tab-view section-stack"></section>
  </main>

  <!-- Modal: reiniciar -->
  <div id="modal-reset" class="mc-modal-backdrop">
    <div class="mc-panel mc-modal p-lg">
      <h3 class="font-pixel text-redstone text-base" style="margin: 0 0 8px 0;">¿BORRAR TODO EL MUNDO?</h3>
      <p class="text-xs text-muted" style="margin: 0 0 10px 0;">Se reinician hitos, economía, leyes, lore y censo en Supabase para TODOS. Antes se guarda un punto de restauración en Supabase.</p>
      <label class="text-xs font-mono text-white" style="display:block;margin-bottom:6px;">Para evitar clics por error, escribe <strong>BORRAR</strong>:</label>
      <input id="reset-confirm-input" class="mc-input font-mono" style="margin-bottom:14px;" placeholder="Escribe BORRAR" autocomplete="off" />
      <div class="flex-row-wrap" style="justify-content: flex-end; gap: 8px;">
        <button class="mc-btn" data-action="close-modal">Cancelar</button>
        <button class="mc-btn mc-btn-redstone" data-action="confirm-reset">Sí, borrar todo</button>
      </div>
    </div>
  </div>

  <!-- Modal: Supabase / puntos de restauración -->
  <div id="modal-backup" class="mc-modal-backdrop">
    <div class="mc-panel mc-modal p-lg">
      <div class="flex-between" style="margin-bottom: 10px;">
        <h3 class="font-pixel text-emerald text-base" style="margin: 0;">SUPABASE · NUBE DEL MUNDO</h3>
        <button class="mc-btn" data-action="close-modal" style="padding: 3px 8px;">✕</button>
      </div>
      <div id="cloud-backup-panel" class="mc-panel-dark p-sm"></div>
    </div>
  </div>

  <!-- Modal: resumen -->
  <div id="modal-report" class="mc-modal-backdrop">
    <div class="mc-panel mc-modal p-lg">
      <div class="flex-between" style="margin-bottom: 10px;">
        <h3 class="font-pixel text-diamond text-base" style="margin: 0;">RESUMEN PARA DISCORD</h3>
        <button class="mc-btn" data-action="close-modal" style="padding: 3px 8px;">✕</button>
      </div>
      <textarea id="report-area" rows="12" class="mc-textarea font-mono" readonly style="font-size: 11px; margin-bottom: 12px;"></textarea>
      <div class="flex-row-wrap" style="justify-content: flex-end;">
        <button class="mc-btn mc-btn-diamond" data-action="copy-report">📋 Copiar</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=20261117193000"></script>
  <script src="cloud.js?v=20261117193000"></script>
  <script src="icons.js?v=20261117193000"></script>
  <script src="eras.js?v=20261117193000"></script>
  <script src="data.js?v=20261117193000"></script>
  <script src="engine.js?v=20261117193000"></script>
  <script src="app.js?v=20261117193000"></script>
</body>
</html>
